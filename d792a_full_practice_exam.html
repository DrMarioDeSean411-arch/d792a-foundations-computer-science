<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D792A — Foundations of Computer Science | Practice Exam</title>
<style>

  :root {
    --green: #1D9E75; --green-bg: #EAF3DE;
    --red: #A32D2D; --red-bg: #FCEBEB;
    --amber: #B45309; --amber-bg: #FFF3E0;
    --purple: #534AB7; --purple-bg: #EEEDFE;
    --blue: #2563A8; --blue-bg: #E8F1FA;
    --label: #9b9b97; --label-dark: #6b6b67;
    --hover: #f0eeea;
    --bg: #f5f5f3; --border: #e0ddd6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
  }
  .shell { max-width: 860px; margin: 0 auto; }
  .card {
    background: #fff;
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .topbar h1 { margin: 0 0 4px; font-size: 22px; }
  .topbar .subtitle { color: var(--label-dark); font-size: 14px; margin-bottom: 14px; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center;
    font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px;
  }
  .pill.c1 { background: var(--green-bg); color: var(--green); }
  .pill.c2 { background: var(--amber-bg); color: var(--amber); }
  .pill.c3 { background: var(--purple-bg); color: var(--purple); }
  .pill.c4 { background: var(--blue-bg); color: var(--blue); }
  .pill.mixed { background: var(--hover); color: var(--label-dark); }

  .scoreboard { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .stat-card {
    background: var(--bg); border: 0.5px solid var(--border); border-radius: 10px;
    padding: 12px 8px; text-align: center;
  }
  .stat-card .num { font-size: 20px; font-weight: 700; }
  .stat-card .lbl { font-size: 11px; color: var(--label); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-card.pass .num { color: var(--green); }
  .stat-card.fail .num { color: var(--red); }

  .progress-track { height: 5px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 14px; }
  .progress-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.3s ease; }

  .nav-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .nav-btn {
    border: 0.5px solid var(--border); background: #fff; color: #1a1a1a;
    font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 9px;
    cursor: pointer; transition: background 0.15s ease;
  }
  .nav-btn:hover:not(:disabled) { background: var(--hover); }
  .nav-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .nav-btn:disabled { color: var(--label); cursor: not-allowed; opacity: 0.6; }
  .nav-btn .soon { display: block; font-size: 10px; font-weight: 400; color: var(--label); margin-top: 2px; }

  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
  .summary-card {
    border-radius: 10px; padding: 12px; cursor: pointer; border: 0.5px solid var(--border);
    font-size: 13px; font-weight: 600;
  }
  .summary-card.pass { background: var(--green-bg); color: var(--green); }
  .summary-card.fail { background: var(--red-bg); color: var(--red); }
  .summary-card .sub { font-weight: 400; font-size: 12px; margin-top: 2px; color: inherit; opacity: 0.85; }

  .tab-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab {
    width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; border: 0.5px solid var(--border); background: #fff; color: var(--label-dark);
    cursor: pointer;
  }
  .tab.correct { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .tab.wrong { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .tab.current { outline: 2px solid #1a1a1a; outline-offset: 1px; }

  .q-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
  .diff-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--hover); color: var(--label-dark); }
  .diff-badge.found { background: var(--green-bg); color: var(--green); }
  .diff-badge.inter { background: var(--amber-bg); color: var(--amber); }
  .diff-badge.adv { background: var(--red-bg); color: var(--red); }
  .topic-pill { font-size: 11px; color: var(--label-dark); background: var(--hover); padding: 3px 9px; border-radius: 999px; }
  .q-counter { font-size: 12px; color: var(--label); margin-left: auto; }

  .stem { font-size: 16px; font-weight: 600; line-height: 1.5; margin-bottom: 12px; }
  .scenario { font-size: 14px; line-height: 1.6; color: #333; background: var(--bg); border: 0.5px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  pre.code {
    background: #1a1a1a; color: #eaeaea; padding: 14px; border-radius: 8px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px; overflow-x: auto; margin-bottom: 12px; line-height: 1.5;
  }

  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    text-align: left; padding: 12px 14px; border-radius: 10px; border: 0.5px solid var(--border);
    background: #fff; font-size: 14px; cursor: pointer;
  }
  .opt:hover:not(.locked) { background: var(--hover); }
  .opt.locked { cursor: default; }
  .opt.correct-answer { background: var(--green-bg); border-color: var(--green); color: var(--green); font-weight: 600; }
  .opt.wrong-answer { background: var(--red-bg); border-color: var(--red); color: var(--red); font-weight: 600; }

  .feedback { margin-top: 14px; padding: 14px; border-radius: 10px; background: var(--bg); border: 0.5px solid var(--border); }
  .feedback .rationale { font-size: 14px; line-height: 1.55; }
  .feedback .misconception { font-size: 13px; font-style: italic; color: var(--label-dark); margin-top: 8px; }

  .nav-buttons { display: flex; justify-content: space-between; margin-top: 16px; }
  .nav-buttons button {
    border: 0.5px solid var(--border); background: #fff; padding: 10px 18px; border-radius: 9px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .nav-buttons button:disabled { opacity: 0.4; cursor: not-allowed; }
  .nav-buttons button:hover:not(:disabled) { background: var(--hover); }

  .breakdown-title { font-size: 13px; font-weight: 700; color: var(--label-dark); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 10px; }
  .bd-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .bd-label { width: 190px; flex-shrink: 0; color: var(--label-dark); }
  .bd-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .bd-fill { height: 100%; border-radius: 4px; }
  .bd-pct { width: 42px; text-align: right; font-weight: 600; flex-shrink: 0; }

  @media (max-width: 600px) {
    .scoreboard { grid-template-columns: repeat(3, 1fr); }
    .bd-label { width: 120px; font-size: 12px; }
  }


  /* ---- additions: lettered options, exam mode, results ---- */
  .opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; line-height: 1.45; }
  .opt .ltr { flex: 0 0 22px; font-weight: 700; color: var(--label-dark); }
  .opt.picked { border-color: #1a1a1a; background: var(--hover); }
  .opt.correct-answer .ltr, .opt.wrong-answer .ltr { color: inherit; }
  .tab.answered { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .tab.flagged { box-shadow: inset 0 -3px 0 var(--amber); }
  .exam-bar { display: none; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 0.5px solid var(--border); }
  .exam-bar .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; }
  .exam-bar .timer.low { color: var(--red); }
  .exam-bar .spacer { flex: 1; }
  .exam-bar .meta { font-size: 12px; color: var(--label-dark); }
  .btn { border: 0.5px solid var(--border); background: #fff; color: #1a1a1a; padding: 9px 16px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .btn.primary:hover { background: #333; }
  .btn.flag.on { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
  .intro h2 { margin: 0 0 8px; font-size: 18px; }
  .intro p { font-size: 14px; line-height: 1.6; color: #333; margin: 0 0 10px; }
  .intro ul { font-size: 14px; line-height: 1.7; color: #333; margin: 0 0 16px; padding-left: 20px; }
  .results { border: 0.5px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; background: var(--bg); }
  .results .big { font-size: 24px; font-weight: 700; }
  .results .big.pass { color: var(--green); }
  .results .big.fail { color: var(--red); }
  .results .sub { font-size: 13px; color: var(--label-dark); margin: 4px 0 12px; }
  .results .hint { font-size: 12px; color: var(--label-dark); margin-top: 10px; }
  .nav-buttons .mid { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="shell">

  <div class="card topbar">
    <h1>D792A — Foundations of Computer Science</h1>
    <div class="subtitle">Full Practice Exam · Western Governors University · Instructor: Dr. Mario Booker</div>
    <div class="pill-row">
      <span class="pill c1">C1 · Operating Systems</span>
      <span class="pill c2">C2 · Program Foundations</span>
      <span class="pill c3">C3 · Algorithm Efficiency</span>
      <span class="pill c4">C4 · Data Profiling</span>
    </div>
  </div>

  <div class="card">
    <div class="scoreboard" id="scoreboard">
      <div class="stat-card"><div class="num" id="statAnswered">0</div><div class="lbl">Answered</div></div>
      <div class="stat-card"><div class="num" id="statCorrect">0</div><div class="lbl">Correct</div></div>
      <div class="stat-card"><div class="num" id="statWrong">0</div><div class="lbl">Wrong</div></div>
      <div class="stat-card"><div class="num" id="statPct">0%</div><div class="lbl">Score</div></div>
      <div class="stat-card" id="statPassCard"><div class="num" id="statPass">—</div><div class="lbl">Status</div></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="card">
    <div class="nav-row" id="navRow"></div>
  </div>

  <div class="card" id="sectionSummaryCard" style="display:none;">
    <div class="breakdown-title">Section Summary</div>
    <div class="summary-grid" id="summaryGrid"></div>
  </div>

  <div class="card" id="examCard">
    <div class="exam-bar" id="examBar"></div>
    <div class="tab-row" id="tabRow"></div>
    <div id="questionArea"></div>
    <div class="nav-buttons" id="navButtons">
      <button id="prevBtn" onclick="go(-1)">← Previous</button>
      <div class="mid"><button id="flagBtn" class="btn flag" style="display:none" onclick="toggleFlag()">⚑ Flag for review</button></div>
      <button id="nextBtn" onclick="go(1)">Next →</button>
    </div>
  </div>

  <div class="card" id="breakdownCard">
    <div class="breakdown-title">Competency Breakdown</div>
    <div id="breakdownRows"></div>
  </div>

</div>

<script>
/* =========================================================
   D792A — Foundations of Computer Science — Practice Exam
   Aligned to the four course competencies:
   C1 Operating Systems · C2 Program Foundations ·
   C3 Algorithm Efficiency · C4 Data Profiling
   ========================================================= */

const C1_QUESTIONS = [
{
"sec": "c1",
"comp": "C1",
"topic": "Four OS Benefits",
"diff": "found",
"type": "mc",
"stem": "A program asks the OS to save a file and never needs to know which brand of drive is installed. Which OS benefit is at work?",
"opts": [
"Portability",
"Protection",
"Security",
"Resource sharing"
],
"ans": 0,
"rationale": "The same request works across different hardware because the OS hides the device details. That is portability.",
"misconception": "Students often pick Protection because hiding hardware feels like guarding it. Protection is about programs not damaging each other."
},
{
"sec": "c1",
"comp": "C1",
"topic": "Four OS Benefits",
"diff": "found",
"type": "mc",
"stem": "A laptop streams music, recalculates a spreadsheet, and downloads a file at the same moment. Which benefit makes this workable?",
"opts": [
"Portability",
"Resource sharing",
"Security",
"Protection"
],
"ans": 1,
"rationale": "The OS divides processor time and memory among the running programs so each gets a fair share.",
"misconception": "Resource sharing is the benefit students overlook; they often credit \"multitasking\" as if it were separate from the OS."
},
{
"sec": "c1",
"comp": "C1",
"topic": "Four OS Benefits",
"diff": "found",
"type": "mc",
"stem": "A buggy drawing program freezes, yet a document open in another program is untouched. Which benefit is shown?",
"opts": [
"Resource sharing",
"Portability",
"Protection",
"Security"
],
"ans": 2,
"rationale": "Programs are kept apart, so one failing does not corrupt another one's data. That is protection.",
"misconception": "Security and protection sound alike. Protection is about programs staying out of each other's way."
},
{
"sec": "c1",
"comp": "C1",
"topic": "Four OS Benefits",
"diff": "found",
"type": "mc",
"stem": "On a shared lab computer, each student's files stay private behind separate logins. Which benefit does the OS provide?",
"opts": [
"Security",
"Portability",
"Resource sharing",
"Protection"
],
"ans": 0,
"rationale": "Logins, permissions, and access rules decide who may use what. Enforcing them in one place is security.",
"misconception": "Students confuse this with protection. Security controls people; protection controls programs."
},
{
"sec": "c1",
"comp": "C1",
"topic": "OS Types",
"diff": "found",
"type": "mc",
"stem": "Which OS type is built for a device that does one dedicated job, such as the controller inside a microwave?",
"opts": [
"Desktop OS",
"Embedded OS",
"Server OS",
"Mobile OS"
],
"ans": 1,
"rationale": "Embedded operating systems run inside single-purpose devices and are tuned to that one task.",
"misconception": "A device with a screen is not automatically a mobile or desktop system. Judge by how many jobs it performs."
},
{
"sec": "c1",
"comp": "C1",
"topic": "OS Types",
"diff": "found",
"type": "mc",
"stem": "Touch input, battery conservation, and one foreground app at a time are design priorities of which OS type?",
"opts": [
"Desktop OS",
"Server OS",
"Mobile OS",
"Embedded OS"
],
"ans": 2,
"rationale": "Mobile operating systems are tuned for touch screens, limited batteries, and a single active app.",
"misconception": "Some students choose embedded because phones are small. Phones run many apps and a full user interface."
},
{
"sec": "c1",
"comp": "C1",
"topic": "Kernel & Drivers",
"diff": "found",
"type": "mc",
"stem": "Which part of an operating system has privileged, direct control over the processor and memory?",
"opts": [
"The shell",
"A device driver",
"The kernel",
"An application"
],
"ans": 2,
"rationale": "The kernel is the core of the OS and the only part with unrestricted control of the processor and memory.",
"misconception": "The shell is the command interface the user types into. It talks to the kernel but is not the kernel."
},
{
"sec": "c1",
"comp": "C1",
"topic": "Kernel & Drivers",
"diff": "found",
"type": "mc",
"stem": "What does a device driver do?",
"opts": [
"Decides which process receives the next slice of CPU time",
"Records where each file is stored on the disk surface",
"Draws windows and icons for the person using the computer",
"Translates OS requests into commands one specific device understands"
],
"ans": 3,
"rationale": "A driver is a small program that lets the OS communicate with one particular piece of hardware.",
"misconception": "Drivers are often mistaken for hardware. They are software."
},
{
"sec": "c1",
"comp": "C1",
"topic": "Processes & Scheduling",
"diff": "found",
"type": "mc",
"stem": "What is the difference between a program on disk and a process?",
"opts": [
"A process is the program's source code before it is compiled",
"A process is the file that stores the program on disk",
"A process is the hardware chip that executes the program",
"A process is the program while it is actually running"
],
"ans": 3,
"rationale": "A program is a stored set of instructions. When it is launched and running, it becomes a process.",
"misconception": "Students use the two words interchangeably. One program can produce several processes."
},
{
"sec": "c1",
"comp": "C1",
"topic": "Processes & Scheduling",
"diff": "found",
"type": "mc",
"stem": "Processes run strictly in order of arrival, and each finishes before the next one starts. Which scheduling strategy is this?",
"opts": [
"First-come, first-served",
"Shortest-job-first scheduling",
"Priority scheduling",
"Round-robin scheduling"
],
"ans": 0,
"rationale": "First-come, first-served works like one line at a ticket counter: whoever arrived first runs to completion.",
"misconception": "Round-robin also uses a line, but it gives short turns instead of letting a process run to completion."
},
{
"sec": "c1",
"comp": "C1",
"topic": "Processes & Scheduling",
"diff": "found",
"type": "mc",
"stem": "Each process gets an equal, short time slice and then moves to the back of the line. Which scheduling strategy is this?",
"opts": [
"First-come, first-served",
"Round-robin",
"Priority scheduling",
"Real-time scheduling"
],
"ans": 1,
"rationale": "Round-robin rotates through the processes, giving each one a short turn before the next.",
"misconception": "The rotating turn is the clue. First-come, first-served never interrupts a running process."
},
{
"sec": "c1",
"comp": "C1",
"topic": "File System & Memory",
"diff": "found",
"type": "mc",
"stem": "Which OS function tracks where a file's bytes sit on the disk so the file can be opened by name?",
"opts": [
"Memory allocation management",
"Device management",
"File system organization",
"Process management"
],
"ans": 2,
"rationale": "The file system records the location and structure of stored data, so a name can be turned into disk locations.",
"misconception": "Memory management handles RAM, not storage. Students blur the two."
},
{
"sec": "c1",
"comp": "C1",
"topic": "Kernel & Drivers",
"diff": "inter",
"type": "mc",
"stem": "What is the main drawback of a monolithic kernel?",
"opts": [
"Services must pass messages, which slows every request",
"A fault in one built-in service can bring down the whole system",
"It must route every hardware command through a separate server",
"It is limited to embedded devices with one task"
],
"ans": 1,
"rationale": "A monolithic kernel keeps its services together for speed, so a bug in one service can crash everything.",
"misconception": "Message passing overhead belongs to the microkernel design, not the monolithic one."
},
{
"sec": "c1",
"comp": "C1",
"topic": "Kernel & Drivers",
"diff": "inter",
"type": "mc",
"stem": "A designer picks a microkernel so a failing service will not crash the system. What cost comes with that choice?",
"opts": [
"Every service must run with full kernel privilege",
"The kernel can no longer manage memory for processes",
"Extra communication between separated services can reduce speed",
"Device drivers can no longer be installed on the system"
],
"ans": 2,
"rationale": "Separating services makes the system more stable, but they must communicate, and that added communication can slow performance.",
"misconception": "Students assume stability comes free. Every design trades something."
},
{
"sec": "c1",
"comp": "C1",
"topic": "Kernel & Drivers",
"diff": "inter",
"type": "mc",
"stem": "Most mainstream desktop systems use a kernel that blends monolithic speed with microkernel-style separation. What is it called?",
"opts": [
"Hybrid kernel",
"Real-time kernel",
"Monolithic kernel",
"Microkernel"
],
"ans": 0,
"rationale": "A hybrid kernel mixes both approaches. Windows and macOS are common examples.",
"misconception": "The word \"hybrid\" is the clue; students sometimes assume macOS must be purely microkernel-based."
},
{
"sec": "c1",
"comp": "C1",
"topic": "OS Types",
"diff": "inter",
"type": "mc",
"stem": "A company needs an OS tuned to handle thousands of simultaneous web requests with nobody at a keyboard. Which type fits?",
"opts": [
"Desktop OS",
"Server OS",
"Mobile OS",
"Embedded OS"
],
"ans": 1,
"rationale": "A server OS is built to serve many clients reliably, often without a screen or a local user.",
"misconception": "Desktop systems can host sites, but they are tuned for one person at a time."
},
{
"sec": "c1",
"comp": "C1",
"topic": "File System & Memory",
"diff": "inter",
"type": "mc",
"stem": "Why does the OS give each process its own region of RAM?",
"opts": [
"So the computer needs less physical RAM overall",
"So one process cannot read or overwrite another process's memory",
"So programs load faster by sharing one memory copy",
"So the kernel can run without privileged access"
],
"ans": 1,
"rationale": "Isolated memory regions keep a process from reading or damaging memory that belongs to another process.",
"misconception": "Isolation does not reduce the RAM needed. It protects processes from one another."
},
{
"sec": "c1",
"comp": "C1",
"topic": "OS Types",
"diff": "inter",
"type": "mc",
"stem": "A classmate says the OS is just the GUI: the windows, icons, and taskbar. What is the best correction?",
"opts": [
"The interface is one visible layer; most OS work happens out of sight",
"That is right, because the OS exists mainly to draw windows and icons for users",
"Icons are managed by the kernel while windows are managed by device drivers",
"Server systems have extra OS work, but desktops have none beyond the interface"
],
"ans": 0,
"rationale": "The GUI, or desktop environment, is only the visible surface. Most OS work, such as scheduling and memory management, is invisible.",
"misconception": "People equate the OS with what they see. Most of its work happens out of sight."
},
{
"sec": "c1",
"comp": "C1",
"topic": "OS Tools & Command Line",
"diff": "inter",
"type": "mc",
"stem": "A Linux administrator runs chmod on a script. What does the command change?",
"opts": [
"Which process currently owns the file in RAM",
"Which physical drive the file is stored on",
"Who may read, write, or execute the file",
"Which programming language the file uses"
],
"ans": 2,
"rationale": "chmod modifies the permission settings that control read, write, and execute access.",
"misconception": "Students confuse chmod with commands that list or move files."
},
{
"sec": "c1",
"comp": "C1",
"topic": "OS Tools & Command Line",
"diff": "inter",
"type": "mc",
"stem": "An administrator prefers htop over top. Which reason fits?",
"opts": [
"htop can rewrite the running kernel while the system stays online",
"htop works even when no processes are running",
"top shows memory use but leaves out CPU usage",

],

},
{

{

{

"stem": "The kernel is best described as:",
"opts": [

],

"misconception": "The command line is the shell; a device-specific program is a driver."

const LETTERS = ['A', 'B', 'C', 'D'];
const PASS_PCT = 80;
const SIM_MINUTES = 65;

const SECTIONS = [
  { key: 'c1',  label: 'C1 — Operating Systems',               comp: 'C1' },
  { key: 'c2',  label: 'C2 — Program Foundations',             comp: 'C2' },
  { key: 'c3',  label: 'C3 — Algorithm Efficiency',            comp: 'C3' },
  { key: 'c4',  label: 'C4 — Data Profiling',                  comp: 'C4' },
  { key: 'ch1', label: 'CH1 — OS Challenge',                   comp: 'C1' },
  { key: 'ch2', label: 'CH2 — Program Foundations Challenge',  comp: 'C2' },
  { key: 'ch3', label: 'CH3 — Algorithm Efficiency Challenge', comp: 'C3' },
  { key: 'ch4', label: 'CH4 — Data Profiling Challenge',       comp: 'C4' },
  { key: 'sim', label: 'Simulation (timed)',                   comp: 'mixed' }
];

const COMP_CLASS = { C1: 'c1', C2: 'c2', C3: 'c3', C4: 'c4', mixed: 'mixed' };
const COMP_COLOR = { C1: 'var(--green)', C2: 'var(--amber)', C3: 'var(--purple)', C4: 'var(--blue)' };
const COMP_NAME = { C1: 'Operating Systems', C2: 'Program Foundations', C3: 'Algorithm Efficiency', C4: 'Data Profiling' };

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const QUESTIONS = {
  c1: C1_QUESTIONS, c2: C2_QUESTIONS, c3: C3_QUESTIONS, c4: C4_QUESTIONS,
  ch1: CH1_QUESTIONS, ch2: CH2_QUESTIONS, ch3: CH3_QUESTIONS, ch4: CH4_QUESTIONS,
  sim: SIM_QUESTIONS
};

/* ---- Session-only state (nothing is stored in the browser) ---- */
const STATE = {};   // STATE[key][i] = true | false  (graded)
const SELS = {};    // SELS[key][i]  = selected option index
const FLAGS = {};   // FLAGS.sim[i]  = true when flagged for review
SECTIONS.forEach(s => { STATE[s.key] = {}; SELS[s.key] = {}; FLAGS[s.key] = {}; });

const SIM = { status: 'ready', secondsLeft: SIM_MINUTES * 60, handle: null, usedSeconds: 0 };

let currentSection = 'c1';
let currentIndex = 0;

function isLive() { return currentSection === 'sim' && SIM.status === 'running'; }
function isDone() { return currentSection === 'sim' && SIM.status === 'done'; }

/* ---------------- navigation ---------------- */
function buildNav() {
  const nav = document.getElementById('navRow');
  nav.innerHTML = '';
  SECTIONS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (s.key === currentSection ? ' active' : '');
    let label = s.label;
    if (s.key === 'sim' && SIM.status === 'running') label += '<span class="soon">in progress</span>';
    btn.innerHTML = label;
    btn.onclick = () => switchSection(s.key);
    nav.appendChild(btn);
  });
}

function switchSection(key) {
  currentSection = key;
  currentIndex = 0;
  buildNav();
  buildTabRow();
  renderQuestion();
  updateScoreboard();
}

function buildTabRow() {
  const row = document.getElementById('tabRow');
  row.innerHTML = '';
  if (currentSection === 'sim' && SIM.status === 'ready') return;
  QUESTIONS[currentSection].forEach((q, i) => {
    const tab = document.createElement('div');
    let cls = 'tab';
    if (isLive()) {
      if (SELS.sim[i] !== undefined) cls += ' answered';
      if (FLAGS.sim[i]) cls += ' flagged';
    } else {
      if (STATE[currentSection][i] === true) cls += ' correct';
      else if (STATE[currentSection][i] === false) cls += ' wrong';
    }
    if (i === currentIndex) cls += ' current';
    tab.className = cls;
    tab.textContent = i + 1;
    tab.onclick = () => { currentIndex = i; renderQuestion(); buildTabRow(); };
    row.appendChild(tab);
  });
}

function diffLabel(d) { return d === 'found' ? 'Foundational' : d === 'inter' ? 'Intermediate' : 'Advanced'; }
function fmtTime(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

/* ---------------- rendering ---------------- */
function updateExamBar() {
  const bar = document.getElementById('examBar');
  if (currentSection !== 'sim' || SIM.status === 'ready') { bar.style.display = 'none'; bar.innerHTML = ''; return; }
  bar.style.display = 'flex';
  const n = QUESTIONS.sim.length;
  if (SIM.status === 'running') {
    const answered = Object.keys(SELS.sim).length;
    bar.innerHTML =
      '<span class="timer' + (SIM.secondsLeft <= 300 ? ' low' : '') + '" id="simTimer">' + fmtTime(SIM.secondsLeft) + '</span>' +
      '<span class="meta">' + answered + ' of ' + n + ' answered</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn primary" onclick="submitSim(false)">Submit exam</button>';
  } else {
    bar.innerHTML =
      '<span class="meta">Attempt submitted · time used ' + fmtTime(SIM.usedSeconds) + '</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn" onclick="retakeSim()">Retake simulation</button>';
  }
}

function simIntroHtml() {
  const n = QUESTIONS.sim.length;
  return '<div class="intro">' +
    '<h2>Timed simulation</h2>' +
    '<p>This section mirrors the format of the official D792A comprehensive practice test: ' + n + ' multiple-choice questions, four options each, with all four competencies mixed together.</p>' +
    '<ul>' +
    '<li>Time limit: ' + SIM_MINUTES + ' minutes. The attempt submits itself when the clock reaches zero.</li>' +
    '<li>No feedback while you work. You can change answers and flag questions for review.</li>' +
    '<li>After you submit, you see your score, a breakdown by competency, and the full explanation for every question.</li>' +
    '<li>Work without notes. A score of ' + PASS_PCT + '% or higher is the readiness target.</li>' +
    '</ul>' +
    '<button class="btn primary" onclick="startSim()">Begin timed attempt</button>' +
    '</div>';
}

function simResultsHtml() {
  const qs = QUESTIONS.sim;
  const tally = { C1: [0, 0], C2: [0, 0], C3: [0, 0], C4: [0, 0] };
  let correct = 0, unanswered = 0;
  qs.forEach((q, i) => {
    tally[q.comp][1]++;
    if (STATE.sim[i] === true) { correct++; tally[q.comp][0]++; }
    if (SELS.sim[i] === undefined) unanswered++;
  });
  const pct = Math.round(correct / qs.length * 100);
  const pass = pct >= PASS_PCT;
  let rows = '';
  ['C1', 'C2', 'C3', 'C4'].forEach(c => {
    const p = tally[c][1] ? Math.round(tally[c][0] / tally[c][1] * 100) : 0;
    rows += '<div class="bd-row"><div class="bd-label">' + c + ' · ' + COMP_NAME[c] + '</div>' +
      '<div class="bd-track"><div class="bd-fill" style="width:' + p + '%;background:' + COMP_COLOR[c] + ';"></div></div>' +
      '<div class="bd-pct">' + p + '%</div></div>';
  });
  return '<div class="results">' +
    '<div class="big ' + (pass ? 'pass' : 'fail') + '">' + correct + ' / ' + qs.length + ' · ' + pct + '%</div>' +
    '<div class="sub">' + (pass ? 'At or above the ' + PASS_PCT + '% readiness target.' : 'Below the ' + PASS_PCT + '% readiness target.') +
    (unanswered ? ' ' + unanswered + ' unanswered.' : '') + '</div>' + rows +
    '<div class="hint">Select any question number above to review the correct answer and explanation.</div>' +
    '</div>';
}

function renderQuestion() {
  const area = document.getElementById('questionArea');
  const navButtons = document.getElementById('navButtons');
  const flagBtn = document.getElementById('flagBtn');
  updateExamBar();

  if (currentSection === 'sim' && SIM.status === 'ready') {
    area.innerHTML = simIntroHtml();
    navButtons.style.display = 'none';
    return;
  }
  navButtons.style.display = 'flex';

  const qs = QUESTIONS[currentSection];
  const q = qs[currentIndex];
  const live = isLive();
  const done = isDone();
  const selected = SELS[currentSection][currentIndex];
  const locked = !live && (selected !== undefined || done);

  let html = '';
  if (done) html += simResultsHtml();

  html += '<div class="q-meta">';
  if (!live) {
    html += '<span class="pill ' + (COMP_CLASS[q.comp] || 'mixed') + '">' + escapeHtml(q.comp) + '</span>';
    html += '<span class="diff-badge ' + q.diff + '">' + diffLabel(q.diff) + '</span>';
    html += '<span class="topic-pill">' + escapeHtml(q.topic) + '</span>';
  }
  html += '<span class="q-counter">Question ' + (currentIndex + 1) + ' of ' + qs.length + '</span>';
  html += '</div>';

  html += '<div class="stem">' + escapeHtml(q.stem) + '</div>';
  if (q.code && q.stemCode) html += '<pre class="code">' + escapeHtml(q.stemCode) + '</pre>';

  html += '<div class="opts">';
  q.opts.forEach((opt, i) => {
    let cls = 'opt' + (locked ? ' locked' : '');
    if (live && selected === i) cls += ' picked';
    if (locked) {
      if (i === q.ans) cls += ' correct-answer';
      else if (i === selected) cls += ' wrong-answer';
    }
    html += '<button class="' + cls + '"' + (locked ? '' : ' onclick="selectOption(' + i + ')"') + '>' +
      '<span class="ltr">' + LETTERS[i] + '.</span><span>' + escapeHtml(opt) + '</span></button>';
  });
  html += '</div>';

  if (locked) {
    html += '<div class="feedback">';
    if (done && selected === undefined) html += '<div class="rationale"><em>Not answered.</em></div>';
    html += '<div class="rationale"><strong>' + LETTERS[q.ans] + ' is correct.</strong> ' + escapeHtml(q.rationale) + '</div>';
    html += '<div class="misconception">' + escapeHtml(q.misconception) + '</div>';
    html += '</div>';
  }

  area.innerHTML = html;
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === qs.length - 1;
  flagBtn.style.display = live ? 'inline-block' : 'none';
  flagBtn.className = 'btn flag' + (live && FLAGS.sim[currentIndex] ? ' on' : '');
  flagBtn.textContent = live && FLAGS.sim[currentIndex] ? '⚑ Flagged' : '⚑ Flag for review';
}

/* ---------------- answering ---------------- */
function selectOption(i) {
  const q = QUESTIONS[currentSection][currentIndex];
  if (isLive()) {
    SELS.sim[currentIndex] = i;           // answers stay changeable until submit
    renderQuestion();
    buildTabRow();
    return;
  }
  if (SELS[currentSection][currentIndex] !== undefined) return;
  SELS[currentSection][currentIndex] = i;
  STATE[currentSection][currentIndex] = (i === q.ans);
  renderQuestion();
  buildTabRow();
  refreshSummaries();
}

function toggleFlag() {
  if (!isLive()) return;
  FLAGS.sim[currentIndex] = !FLAGS.sim[currentIndex];
  renderQuestion();
  buildTabRow();
}

function go(delta) {
  const next = currentIndex + delta;
  if (next < 0 || next >= QUESTIONS[currentSection].length) return;
  currentIndex = next;
  renderQuestion();
  buildTabRow();
}

/* ---------------- simulation lifecycle ---------------- */
function startSim() {
  SIM.status = 'running';
  SIM.secondsLeft = SIM_MINUTES * 60;
  SIM.usedSeconds = 0;
  SELS.sim = {}; STATE.sim = {}; FLAGS.sim = {};
  currentIndex = 0;
  if (SIM.handle) clearInterval(SIM.handle);
  SIM.handle = setInterval(tick, 1000);
  buildNav(); buildTabRow(); renderQuestion(); refreshSummaries();
}

function tick() {
  if (SIM.status !== 'running') return;
  SIM.secondsLeft--;
  const el = document.getElementById('simTimer');
  if (el) {
    el.textContent = fmtTime(Math.max(SIM.secondsLeft, 0));
    if (SIM.secondsLeft <= 300) el.classList.add('low');
  }
  if (SIM.secondsLeft <= 0) submitSim(true);
}

function submitSim(auto) {
  if (SIM.status !== 'running') return;
  const qs = QUESTIONS.sim;
  const unanswered = qs.length - Object.keys(SELS.sim).length;
  if (!auto && unanswered > 0) {
    const msg = unanswered + ' question' + (unanswered === 1 ? ' is' : 's are') + ' unanswered. Submit anyway?';
    if (typeof window.confirm === 'function' && !window.confirm(msg)) return;
  }
  if (SIM.handle) { clearInterval(SIM.handle); SIM.handle = null; }
  SIM.usedSeconds = SIM_MINUTES * 60 - Math.max(SIM.secondsLeft, 0);
  SIM.status = 'done';
  STATE.sim = {};
  qs.forEach((q, i) => { STATE.sim[i] = (SELS.sim[i] === q.ans); });
  currentIndex = 0;
  buildNav(); buildTabRow(); renderQuestion(); refreshSummaries();
}

function retakeSim() {
  if (SIM.handle) { clearInterval(SIM.handle); SIM.handle = null; }
  SIM.status = 'ready';
  SIM.secondsLeft = SIM_MINUTES * 60;
  SIM.usedSeconds = 0;
  SELS.sim = {}; STATE.sim = {}; FLAGS.sim = {};
  currentIndex = 0;
  buildNav(); buildTabRow(); renderQuestion(); refreshSummaries();
}

/* ---------------- scoreboard, summaries, breakdown ---------------- */
function refreshSummaries() { updateScoreboard(); renderSectionSummary(); renderBreakdown(); }

function updateScoreboard() {
  let answered = 0, correct = 0, wrong = 0, total = 0;
  SECTIONS.forEach(s => {
    total += QUESTIONS[s.key].length;
    Object.values(STATE[s.key]).forEach(v => { answered++; if (v === true) correct++; else wrong++; });
  });
  document.getElementById('statAnswered').textContent = answered;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  const pct = answered ? Math.round(correct / answered * 100) : 0;
  document.getElementById('statPct').textContent = pct + '%';
  const passCard = document.getElementById('statPassCard');
  const passEl = document.getElementById('statPass');
  if (!answered) { passEl.textContent = '—'; passCard.className = 'stat-card'; }
  else if (pct >= PASS_PCT) { passEl.textContent = 'Pass'; passCard.className = 'stat-card pass'; }
  else { passEl.textContent = 'Below 80%'; passCard.className = 'stat-card fail'; }
  document.getElementById('progressFill').style.width = total ? Math.round(answered / total * 100) + '%' : '0%';
}

function renderSectionSummary() {
  const card = document.getElementById('sectionSummaryCard');
  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = '';
  let any = false;
  SECTIONS.forEach(s => {
    const qs = QUESTIONS[s.key];
    const entries = Object.values(STATE[s.key]);
    if (!entries.length) return;
    any = true;
    const correct = entries.filter(v => v === true).length;
    const pct = Math.round(correct / entries.length * 100);
    const div = document.createElement('div');
    div.className = 'summary-card ' + (pct >= PASS_PCT ? 'pass' : 'fail');
    div.innerHTML = s.label + '<div class="sub">' + correct + '/' + entries.length + ' of ' + qs.length + ' · ' + pct + '%</div>';
    div.onclick = () => switchSection(s.key);
    grid.appendChild(div);
  });
  card.style.display = any ? 'block' : 'none';
}

function renderBreakdown() {
  const rows = document.getElementById('breakdownRows');
  rows.innerHTML = '';
  const comps = ['C1', 'C2', 'C3', 'C4'];
  const ct = {}; comps.forEach(c => ct[c] = { c: 0, t: 0 });
  const dt = { found: { c: 0, t: 0 }, inter: { c: 0, t: 0 }, adv: { c: 0, t: 0 } };
  SECTIONS.forEach(s => {
    QUESTIONS[s.key].forEach((q, i) => {
      if (STATE[s.key][i] === undefined) return;
      ct[q.comp].t++; dt[q.diff].t++;
      if (STATE[s.key][i] === true) { ct[q.comp].c++; dt[q.diff].c++; }
    });
  });
  const addRow = (label, o, color) => {
    const p = o.t ? Math.round(o.c / o.t * 100) : 0;
    const row = document.createElement('div');
    row.className = 'bd-row';
    row.innerHTML = '<div class="bd-label">' + label + '</div>' +
      '<div class="bd-track"><div class="bd-fill" style="width:' + p + '%;background:' + color + ';"></div></div>' +
      '<div class="bd-pct">' + p + '%</div>';
    rows.appendChild(row);
  };
  comps.forEach(c => addRow(c + ' · ' + COMP_NAME[c], ct[c], COMP_COLOR[c]));
  addRow('Foundational', dt.found, 'var(--green)');
  addRow('Intermediate', dt.inter, 'var(--amber)');
  addRow('Advanced', dt.adv, 'var(--red)');
}

/* ---------------- init ---------------- */
buildNav();
buildTabRow();
renderQuestion();
refreshSummaries();
</script>
</body>
</html>
